<!DOCTYPE html>
<html lang="th" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบบริหารงานเครื่องจักรกล - กองช่าง อบต.ท่าก๊อ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Sarabun', sans-serif; -webkit-tap-highlight-color: transparent; }
    .glass-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="h-full text-slate-900 bg-slate-50 flex flex-col antialiased">

  <div id="toastContainer" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0"></div>

  <!-- Header Navigation -->
  <header class="glass-header text-slate-900 sticky top-0 z-40 border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 gap-3">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-amber-500 flex items-center justify-center text-slate-950 font-black shadow-md shrink-0">
            <i class="fa-solid fa-truck-monster text-lg"></i>
          </div>
          <div>
            <h1 class="font-black text-base sm:text-lg leading-tight text-slate-900">ระบบบริหารงานเครื่องจักรกล</h1>
            <p class="text-[11px] text-amber-600 font-bold">กองช่าง อบต.ท่าก๊อ</p>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <button onclick="openReqModal()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-black px-3.5 py-2 rounded-xl text-xs sm:text-sm shadow-sm transition active:scale-95 flex items-center gap-1.5">
            <i class="fa-solid fa-plus-circle"></i> <span class="hidden sm:inline">ยื่นคำขอเครื่องจักร</span>
          </button>

          <div id="adminArea">
            <button id="btnLogin" onclick="openLoginModal()" class="bg-slate-900 text-white px-3.5 py-2 rounded-xl text-xs font-black shadow-sm transition">
              <i class="fa-solid fa-key text-amber-400 mr-1"></i> Admin
            </button>
            <div id="adminBadge" class="hidden flex items-center gap-1.5">
              <span class="bg-emerald-50 text-emerald-800 border border-emerald-300 text-xs px-3 py-1.5 rounded-xl font-extrabold">Admin Active</span>
              <button onclick="logoutAdmin()" class="bg-rose-50 text-rose-600 border border-rose-200 p-2 rounded-xl" title="ออกจากระบบ"><i class="fa-solid fa-power-off text-xs"></i></button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Body -->
  <main class="max-w-7xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-5 flex-grow space-y-4">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 sm:p-5 space-y-3">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <h2 class="text-base sm:text-lg font-black text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-list-check text-amber-500"></i> รายการคำขอปฏิบัติงานเครื่องจักรกล
        </h2>
        <button onclick="fetchData()" class="bg-slate-100 hover:bg-slate-200 text-slate-800 px-3 py-1.5 rounded-xl text-xs font-bold transition">
          <i class="fa-solid fa-rotate mr-1"></i> รีเฟรช
        </button>
      </div>

      <div id="reqList" class="space-y-3 pt-1"></div>
    </div>
  </main>

  <!-- MODAL: NEW REQUEST -->
  <div id="reqModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center z-50 p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-5 border border-slate-200 my-auto space-y-3 text-xs">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-extrabold text-sm text-slate-900">ยื่นคำขอใช้เครื่องจักรกล</h3>
        <button onclick="closeReqModal()" class="text-slate-400 text-lg font-black">&times;</button>
      </div>
      <form onsubmit="handleReqSubmit(event)" class="space-y-2.5">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-bold mb-1">หมู่ที่</label>
            <input type="number" id="mVillageNo" required class="w-full p-2 bg-slate-50 border rounded-xl font-bold">
          </div>
          <div>
            <label class="block font-bold mb-1">ชื่อหมู่บ้าน</label>
            <input type="text" id="mVillageName" required class="w-full p-2 bg-slate-50 border rounded-xl font-bold">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-bold mb-1">ชื่อผู้ยื่นคำขอ</label>
            <input type="text" id="mRequesterName" required class="w-full p-2 bg-slate-50 border rounded-xl font-bold">
          </div>
          <div>
            <label class="block font-bold mb-1">ตำแหน่ง</label>
            <input type="text" id="mRequesterPosition" required class="w-full p-2 bg-slate-50 border rounded-xl font-bold">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-bold mb-1">วันที่ขอใช้เริ่ม</label>
            <input type="date" id="mReqStartDate" required class="w-full p-2 bg-slate-50 border rounded-xl font-bold">
          </div>
          <div>
            <label class="block font-bold mb-1">ถึงวันที่</label>
            <input type="date" id="mReqEndDate" required class="w-full p-2 bg-slate-50 border rounded-xl font-bold">
          </div>
        </div>
        <div>
          <label class="block font-bold mb-1">ลิงก์เอกสารแนบ (ถ้ามี)</label>
          <input type="url" id="mDocLink" class="w-full p-2 bg-slate-50 border rounded-xl font-bold">
        </div>
        <div class="flex justify-end gap-2 pt-2 border-t">
          <button type="button" onclick="closeReqModal()" class="px-3 py-1.5 bg-slate-100 rounded-xl font-bold">ยกเลิก</button>
          <button type="submit" class="px-4 py-1.5 bg-amber-500 text-slate-950 rounded-xl font-black">ส่งคำขอ</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: APPROVE -->
  <div id="approveModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center z-50 p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-5 border border-slate-200 my-auto space-y-3 text-xs">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-extrabold text-sm text-slate-900">จัดสรรแผนงานและอนุมัติ</h3>
        <button onclick="closeApproveModal()" class="text-slate-400 text-lg font-black">&times;</button>
      </div>
      <form onsubmit="handleApproveSubmit(event)" class="space-y-2.5">
        <input type="hidden" id="appReqId">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-bold mb-1">เริ่มตามแผน</label>
            <input type="date" id="appPlanStart" required class="w-full p-2 bg-slate-50 border rounded-xl font-bold">
          </div>
          <div>
            <label class="block font-bold mb-1">สิ้นสุดตามแผน</label>
            <input type="date" id="appPlanEnd" required class="w-full p-2 bg-slate-50 border rounded-xl font-bold">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-bold mb-1">จำนวนวัน</label>
            <input type="number" id="appPlanDays" required min="1" class="w-full p-2 bg-slate-50 border rounded-xl font-bold">
          </div>
          <div>
            <label class="block font-bold mb-1">ประมาณการน้ำมัน (ลิตร)</label>
            <input type="number" id="appPlanFuel" required min="0" class="w-full p-2 bg-slate-50 border rounded-xl font-bold">
          </div>
        </div>
        <div>
          <label class="block font-bold mb-1">เครื่องจักรกลที่จัดสรร</label>
          <input type="text" id="appMachine" required placeholder="เช่น รถขุดตีนตะขาบ" class="w-full p-2 bg-slate-50 border rounded-xl font-bold">
        </div>
        <div>
          <label class="block font-bold mb-1">ช่างผู้ปฏิบัติงาน</label>
          <input type="text" id="appOperator" required placeholder="ระบุชื่อช่าง" class="w-full p-2 bg-slate-50 border rounded-xl font-bold">
        </div>
        <div class="flex justify-end gap-2 pt-2 border-t">
          <button type="button" onclick="closeApproveModal()" class="px-3 py-1.5 bg-slate-100 rounded-xl font-bold">ยกเลิก</button>
          <button type="submit" class="px-4 py-1.5 bg-indigo-600 text-white rounded-xl font-black">อนุมัติแผนงาน</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: FINALIZE EASY PASS -->
  <div id="finalizeModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center z-50 p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-5 border border-slate-200 my-auto space-y-3 text-xs">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-extrabold text-sm text-slate-900">สรุปผลปฏิบัติงาน & ส่ง Easy Pass</h3>
        <button onclick="closeFinalizeModal()" class="text-slate-400 text-lg font-black">&times;</button>
      </div>
      <form onsubmit="handleFinalizeSubmit(event)" class="space-y-2.5">
        <input type="hidden" id="finReqId">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-bold mb-1">วันเริ่มงานจริง</label>
            <input type="date" id="finStart" required class="w-full p-2 bg-slate-50 border rounded-xl font-bold">
          </div>
          <div>
            <label class="block font-bold mb-1">วันเสร็จจริง</label>
            <input type="date" id="finEnd" required class="w-full p-2 bg-slate-50 border rounded-xl font-bold">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-bold mb-1">จำนวนวันจริง</label>
            <input type="number" id="finDays" required min="1" class="w-full p-2 bg-slate-50 border rounded-xl font-bold">
          </div>
          <div>
            <label class="block font-bold mb-1">น้ำมันใช้จริง (ลิตร)</label>
            <input type="number" id="finFuel" required min="0" class="w-full p-2 bg-slate-50 border rounded-xl font-bold">
          </div>
        </div>
        <div class="flex justify-end gap-2 pt-2 border-t">
          <button type="button" onclick="closeFinalizeModal()" class="px-3 py-1.5 bg-slate-100 rounded-xl font-bold">ยกเลิก</button>
          <button type="submit" class="px-4 py-1.5 bg-emerald-600 text-white rounded-xl font-black">ส่ง Easy Pass สรุปรายจ่าย</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: LOGIN -->
  <div id="loginModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-xs w-full p-5 text-center border border-slate-200 space-y-3">
      <h3 class="font-extrabold text-slate-900 text-sm">เข้าสู่ระบบ Admin</h3>
      <input type="password" id="adminPin" placeholder="••••••" maxlength="10" class="w-full border p-2 rounded-xl text-center text-lg font-mono font-bold">
      <div class="flex gap-2 text-xs font-bold">
        <button onclick="closeLoginModal()" class="w-1/2 py-2 bg-slate-100 rounded-xl">ยกเลิก</button>
        <button onclick="submitLogin()" class="w-1/2 py-2 bg-amber-500 text-slate-950 rounded-xl">ยืนยัน</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbVTYcxjkn9s1N7LolnuNzIWGGOCRyUHDlCtO7oOL_FJ9Z2L4gQiEp6APb4FaBzNtku/exec';
    const BUDGET_URL = 'https://script.google.com/macros/s/AKfycbx5j7tZvVEWVaQ3cT9iiPsuy-v-CMiCJcacCbMDH7gpbq-WxqM2uPrDCH1oWSbPuSjN/exec';

    let currentPin = sessionStorage.getItem('mac_pin') || null;
    let reqData = [];

    async function callAPI(action, payload = {}) {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: action, pin: currentPin, payload: payload })
      });
      return await res.json();
    }

    function showToast(msg, isError = false) {
      const c = document.getElementById('toastContainer');
      const t = document.createElement('div');
      t.className = `p-3 rounded-xl text-xs font-bold shadow-lg ${isError ? 'bg-rose-600 text-white' : 'bg-slate-900 text-white'}`;
      t.innerText = msg;
      c.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    window.onload = function() {
      checkAdmin();
      fetchData();
    };

    function checkAdmin() {
      const isAuth = !!currentPin;
      document.getElementById('btnLogin').classList.toggle('hidden', isAuth);
      document.getElementById('adminBadge').classList.toggle('hidden', !isAuth);
      renderUI();
    }

    async function fetchData() {
      try {
        const res = await callAPI('getInitialData');
        reqData = res.requests || [];
        renderUI();
      } catch (e) {
        showToast('โหลดข้อมูลล้มเหลว', true);
      }
    }

    function renderUI() {
      const c = document.getElementById('reqList');
      c.innerHTML = '';
      if (reqData.length === 0) {
        c.innerHTML = `<div class="p-6 text-center text-slate-400 font-bold text-xs">ไม่พบรายการคำขอ</div>`;
        return;
      }

      reqData.forEach(item => {
        const div = document.createElement('div');
        div.className = "bg-slate-50 border p-3.5 rounded-2xl space-y-1.5 text-xs";
        div.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="font-black text-slate-900 text-sm">${item.requestId} - หมู่ ${item.villageNo} ${item.villageName}</span>
            <span class="px-2 py-0.5 rounded-full font-bold text-[10px] ${item.jobProgressStatus === 'ปฏิบัติงานแล้วเสร็จ' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${item.jobProgressStatus}</span>
          </div>
          <div class="text-slate-600 font-semibold"><b>ผู้ยื่น:</b> ${item.requesterName} (${item.requesterPosition}) | <b>ขอใช้:</b> ${item.reqStartDate} ถึง ${item.reqEndDate}</div>
          ${item.assignedMachine ? `<div class="bg-white p-2 rounded-xl border text-slate-800 font-bold"><b>เครื่องจักร:</b> ${item.assignedMachine} \vert{} <b>ช่าง:</b> ${item.assignedOperator}</div>` : ''}
          ${currentPin ? `
            <div class="flex justify-end gap-2 pt-1 border-t">
              ${item.approvalStatus === 'PENDING' ? `<button onclick="openApprove('${item.requestId}', '${item.reqStartDate}', '${item.reqEndDate}')" class="bg-indigo-600 text-white px-3 py-1 rounded-xl font-bold">จัดสรรแผน</button>` : ''}
              ${item.approvalStatus === 'Accepted' && item.jobProgressStatus !== 'ปฏิบัติงานแล้วเสร็จ' ? `<button onclick="openFinalize('${item.requestId}', '${item.planStartDate}', '${item.planEndDate}', ${item.planDays}, ${item.planFuelLiters})" class="bg-emerald-600 text-white px-3 py-1 rounded-xl font-bold">สรุปผล & ส่ง Easy Pass</button>` : ''}
            </div>
          ` : ''}
        `;
        c.appendChild(div);
      });
    }

    function openReqModal() { document.getElementById('reqModal').classList.remove('hidden'); document.getElementById('reqModal').classList.add('flex'); }
    function closeReqModal() { document.getElementById('reqModal').classList.add('hidden'); document.getElementById('reqModal').classList.remove('flex'); }

    async function handleReqSubmit(e) {
      e.preventDefault();
      const payload = {
        villageNo: Number(document.getElementById('mVillageNo').value),
        villageName: document.getElementById('mVillageName').value,
        requesterName: document.getElementById('mRequesterName').value,
        requesterPosition: document.getElementById('mRequesterPosition').value,
        reqStartDate: document.getElementById('mReqStartDate').value,
        reqEndDate: document.getElementById('mReqEndDate').value,
        docLink: document.getElementById('mDocLink').value
      };
      const res = await callAPI('submitRequest', payload);
      closeReqModal();
      showToast(res.message);
      fetchData();
    }

    function openApprove(id, start, end) {
      document.getElementById('appReqId').value = id;
      document.getElementById('appPlanStart').value = start;
      document.getElementById('appPlanEnd').value = end;
      document.getElementById('approveModal').classList.remove('hidden');
      document.getElementById('approveModal').classList.add('flex');
    }
    function closeApproveModal() { document.getElementById('approveModal').classList.add('hidden'); document.getElementById('approveModal').classList.remove('flex'); }

    async function handleApproveSubmit(e) {
      e.preventDefault();
      const payload = {
        requestId: document.getElementById('appReqId').value,
        planStartDate: document.getElementById('appPlanStart').value,
        planEndDate: document.getElementById('appPlanEnd').value,
        planDays: Number(document.getElementById('appPlanDays').value),
        planFuelLiters: Number(document.getElementById('appPlanFuel').value),
        assignedMachine: document.getElementById('appMachine').value,
        assignedOperator: document.getElementById('appOperator').value
      };
      const res = await callAPI('approveRequest', payload);
      closeApproveModal();
      showToast(res.message);
      fetchData();
    }

    function openFinalize(id, start, end, days, fuel) {
      document.getElementById('finReqId').value = id;
      document.getElementById('finStart').value = start;
      document.getElementById('finEnd').value = end;
      document.getElementById('finDays').value = days;
      document.getElementById('finFuel').value = fuel;
      document.getElementById('finalizeModal').classList.remove('hidden');
      document.getElementById('finalizeModal').classList.add('flex');
    }
    function closeFinalizeModal() { document.getElementById('finalizeModal').classList.add('hidden'); document.getElementById('finalizeModal').classList.remove('flex'); }

    async function handleFinalizeSubmit(e) {
      e.preventDefault();
      const payload = {
        requestId: document.getElementById('finReqId').value,
        actualStartDate: document.getElementById('finStart').value,
        actualEndDate: document.getElementById('finEnd').value,
        actualDays: Number(document.getElementById('finDays').value),
        actualFuelLiters: Number(document.getElementById('finFuel').value)
      };
      const res = await callAPI('finalizeJobEasyPass', payload);
      closeFinalizeModal();
      showToast(res.message);
      fetchData();
    }

    function openLoginModal() { document.getElementById('loginModal').classList.remove('hidden'); document.getElementById('loginModal').classList.add('flex'); }
    function closeLoginModal() { document.getElementById('loginModal').classList.add('hidden'); document.getElementById('loginModal').classList.remove('flex'); }

    async function submitLogin() {
      const pin = document.getElementById('adminPin').value;
      const res = await callAPI('verifyAdminPin', {}, pin);
      if (res && res.success) {
        currentPin = pin;
        sessionStorage.setItem('mac_pin', pin);
        checkAdmin();
        closeLoginModal();
        showToast('เข้าสู่ระบบสำเร็จ');
      } else {
        showToast('PIN ไม่ถูกต้อง', true);
      }
    }

    function logoutAdmin() {
      sessionStorage.removeItem('mac_pin');
      currentPin = null;
      checkAdmin();
      showToast('ออกจากระบบแล้ว');
    }
  </script>
</body>
</html>
