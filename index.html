<!DOCTYPE html>
<html lang="th" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบบริหารจัดการเครื่องจักรกล & Easy Pass - อบต.ท่าก๊อ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; color: #0f172a; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    .card-hover-effect { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    .card-hover-effect:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08); }
  </style>
</head>
<body class="text-slate-900 relative min-h-screen antialiased selection:bg-amber-400 selection:text-slate-950 pb-12 bg-slate-50">

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toastContainer" class="fixed top-20 right-5 z-50 space-y-3 pointer-events-none"></div>

  <!-- TOP NAVIGATION BAR -->
  <nav class="bg-slate-900 text-white sticky top-0 z-40 shadow-md border-b border-slate-800">
    <div class="w-full px-4 sm:px-6">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-amber-400 flex items-center justify-center shadow-md">
            <i class="fa-solid fa-truck-monster text-slate-950 text-xl"></i>
          </div>
          <div>
            <span class="font-black text-lg sm:text-xl tracking-tight text-white">
              ระบบเครื่องจักรกล & Easy Pass
            </span>
          </div>
        </div>
        <div class="flex items-center space-x-2.5">
          <button id="btnCreateRequest" onclick="openRequestModal()" class="hidden bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold px-4 py-2 rounded-xl text-xs sm:text-sm shadow-sm transition flex items-center gap-1.5">
            <i class="fa-solid fa-plus-circle text-base"></i> ยื่นคำขอ
          </button>
          <span id="userBadge" class="hidden sm:inline-block bg-slate-800 border border-slate-700 text-amber-400 text-xs px-3.5 py-1.5 rounded-full font-bold">
            Guest
          </span>
          <button id="authBtn" onclick="openLoginModal()" class="bg-amber-400 hover:bg-amber-500 active:scale-95 text-slate-950 font-black px-4 py-2 rounded-xl text-xs sm:text-sm transition shadow-sm flex items-center gap-1.5">
            <i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- NOTIFICATION WIDGET -->
  <div id="notificationWidget" class="hidden w-full px-4 sm:px-6 mt-4">
    <div onclick="switchTab('pendingTab')" class="bg-amber-500 hover:bg-amber-600 text-slate-950 p-3.5 rounded-2xl shadow-sm border border-amber-400 flex items-center justify-between cursor-pointer transition">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded-xl bg-slate-950 text-amber-400 flex items-center justify-center font-black">
          <i class="fa-solid fa-bell animate-bounce"></i>
        </div>
        <span class="font-bold text-xs sm:text-sm">คุณมีคำขอขอใช้เครื่องจักรกลรอการพิจารณาอนุมัติ</span>
      </div>
      <span class="bg-slate-950 text-amber-400 font-black text-xs px-3 py-1 rounded-full"><span id="widgetCount">0</span> รายการ</span>
    </div>
  </div>

  <!-- MAIN CONTAINER -->
  <div class="w-full px-4 sm:px-6 py-5">

    <!-- NAVIGATION TABS -->
    <div class="flex flex-wrap gap-2 mb-5 bg-white p-1.5 rounded-2xl border border-slate-200 shadow-sm w-full sm:w-fit">
      <button onclick="switchTab('trackingTab')" id="btn-trackingTab" class="tab-btn bg-slate-900 text-white font-extrabold px-4 py-2.5 rounded-xl text-xs sm:text-sm shadow-sm transition flex items-center gap-2">
        <i class="fa-solid fa-list-check text-amber-400"></i> 1. ติดตามแผนปฏิบัติงาน
      </button>
      <button onclick="switchTab('pendingTab')" id="btn-pendingTab" class="tab-btn text-slate-600 hover:text-slate-900 font-bold px-4 py-2.5 rounded-xl text-xs sm:text-sm transition relative flex items-center gap-2">
        <i class="fa-solid fa-hourglass-half text-amber-500"></i> 2. คำขอรออนุมัติ
        <span id="pendingBadgeTab" class="hidden ml-1 bg-rose-500 text-white text-[10px] font-black px-2 py-0.5 rounded-full">0</span>
      </button>
    </div>

    <!-- TAB 1: TRACKING -->
    <div id="trackingTab" class="tab-content space-y-4">
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 flex justify-between items-center flex-wrap gap-3">
        <h2 class="text-sm sm:text-base font-black text-slate-900 flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-indigo-600"></span>
          ตารางติดตามแผนปฏิบัติงาน
        </h2>
      </div>
      <div id="jobsTableContainer" class="space-y-3"></div>
    </div>

    <!-- TAB 2: PENDING -->
    <div id="pendingTab" class="tab-content hidden space-y-4">
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 flex justify-between items-center flex-wrap gap-3">
        <h2 class="text-sm sm:text-base font-black text-slate-900 flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-amber-500"></span>
          คำร้องขอรับบริการรอพิจารณาอนุมัติ
        </h2>
      </div>
      <div id="pendingRequestsContainer" class="space-y-3"></div>
    </div>
  </div>

  <!-- MODAL 1: REQUEST FORM MODAL -->
  <div id="requestModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl p-6 w-full max-w-lg shadow-2xl space-y-4 border border-slate-100 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <h3 class="text-base font-extrabold text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-plus-circle text-emerald-500"></i> ยื่นคำขอขอใช้บริการเครื่องจักรกล
        </h3>
        <button onclick="closeRequestModal()" class="text-slate-400 hover:text-slate-600 text-lg font-black">✕</button>
      </div>

      <form id="requestForm" onsubmit="handleRequestSubmit(event)" class="space-y-3 text-xs sm:text-sm">
        <div>
          <label class="block font-bold text-slate-700 mb-1">เรื่องคำร้อง *</label>
          <input type="text" id="reqSubject" required value="ขอสนับสนุนเครื่องจักรกลเพื่อเข้าปฏิบัติงานในพื้นที่" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-bold">
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">ชื่อ-นามสกุล ผู้ยื่นคำขอ *</label>
          <input type="text" id="requesterName" required placeholder="เช่น นายสมชาย ใจดี" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5">
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">ตำแหน่ง / สถานะ *</label>
          <input type="text" id="requesterPosition" required placeholder="เช่น ผู้ใหญ่บ้าน / ประชาชน" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-bold text-slate-700 mb-1">หมู่ที่ *</label>
            <select id="villageNo" required onchange="autoFillVillageName()" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-bold"></select>
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">ชื่อหมู่บ้าน *</label>
            <input type="text" id="villageName" readonly class="w-full bg-slate-100 border border-slate-200 rounded-xl p-2.5 text-slate-700 font-bold">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-bold text-slate-700 mb-1">วันที่ขอใช้วันแรก *</label>
            <input type="date" id="reqStartDate" required class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5">
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">วันที่ขอใช้ถึงวันสุดท้าย *</label>
            <input type="date" id="reqEndDate" required class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5">
          </div>
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">ลิงก์แนบเอกสาร / รูปภาพคำขอ (Google Drive URL)</label>
          <input type="url" id="docLink" placeholder="https://drive.google.com/file/d/..." class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5">
        </div>

        <div class="flex justify-end space-x-2 pt-3 border-t border-slate-100">
          <button type="button" onclick="closeRequestModal()" class="px-4 py-2 text-slate-500">ยกเลิก</button>
          <button type="submit" class="px-5 py-2 bg-emerald-600 text-white font-bold rounded-xl">ส่งคำขอรับบริการ</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL 2: LOGIN MODAL -->
  <div id="loginModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl space-y-4 border border-slate-100">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <h3 class="text-base font-extrabold text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-right-to-bracket text-amber-500"></i> เข้าสู่ระบบเจ้าหน้าที่
        </h3>
        <button onclick="closeLoginModal()" class="text-slate-400 hover:text-slate-600 text-lg font-black">✕</button>
      </div>

      <div class="space-y-3 text-xs sm:text-sm">
        <div>
          <label class="block font-bold text-slate-700 mb-1">ประเภทสิทธิ์ผู้ใช้งาน</label>
          <select id="loginRole" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-bold">
            <option value="SUPER_ADMIN">ผู้ดูแลระบบสูงสุด (Super Admin)</option>
            <option value="DATA_ENTRY">เจ้าหน้าที่บันทึกคำขอ (Data Entry)</option>
          </select>
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">รหัสผ่านยืนยันสิทธิ์</label>
          <input type="password" id="loginPass" placeholder="กรอกรหัสผ่าน (12345)" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-bold" onkeyup="if(event.key==='Enter') performLogin()">
        </div>
      </div>

      <div class="flex justify-end space-x-2 pt-3 border-t border-slate-100">
        <button onclick="closeLoginModal()" class="px-4 py-2 text-slate-500 text-xs">ยกเลิก</button>
        <button onclick="performLogin()" class="px-5 py-2 bg-amber-400 text-slate-950 font-black rounded-xl text-xs">ตกลงเข้าสู่ระบบ</button>
      </div>
    </div>
  </div>

  <!-- MODAL 3: ADMIN EDIT/PLANNING MODAL -->
  <div id="planModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl w-full max-w-5xl shadow-2xl space-y-4 max-h-[92vh] overflow-y-auto border border-slate-100 p-6">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <h3 class="text-base font-extrabold text-slate-900"><i class="fa-solid fa-calendar-check text-indigo-600 mr-2"></i> พิจารณาคำขอ & จัดแผนงาน</h3>
        <button onclick="closePlanModal()" class="text-slate-400 font-black text-lg">✕</button>
      </div>

      <input type="hidden" id="modalRowIndex">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs sm:text-sm">
        <div>
          <label class="block font-bold text-slate-700 mb-1">วันเริ่มแผนงาน</label>
          <input type="date" id="modalPlanStartDate" onchange="recalculateFuel()" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2">
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">วันสิ้นสุดแผนงาน</label>
          <input type="date" id="modalPlanEndDate" onchange="recalculateFuel()" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2">
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">จำนวนวันตามแผน</label>
          <input type="number" id="modalPlanDays" readonly class="w-full bg-slate-100 border border-slate-200 rounded-xl p-2 font-bold text-indigo-600">
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">ราคาน้ำมัน ณ วันจัดแผน (บาท/ลิตร)</label>
          <input type="number" step="0.01" id="modalPlanOilPrice" oninput="recalculateFuel()" value="35.00" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 font-bold text-amber-600">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
        <div>
          <label class="block font-bold text-slate-800 text-xs mb-1">เลือกเครื่องจักรกล</label>
          <div id="modalMachineCheckboxes" class="space-y-1.5 bg-slate-50 p-3 rounded-xl border border-slate-200 max-h-40 overflow-y-auto"></div>
        </div>
        <div>
          <label class="block font-bold text-slate-800 text-xs mb-1">เลือกช่างผู้ปฏิบัติงาน</label>
          <div id="modalOperatorCheckboxes" class="space-y-1.5 bg-slate-50 p-3 rounded-xl border border-slate-200 max-h-40 overflow-y-auto"></div>
        </div>
      </div>

      <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-200 grid grid-cols-2 gap-3 text-xs">
        <div>
          <label class="block font-bold text-slate-600">ประเมินน้ำมันรวม (ลิตร)</label>
          <input type="number" id="modalPlanFuel" readonly class="w-full bg-white border border-emerald-300 rounded-xl p-2 font-bold text-amber-600">
        </div>
        <div>
          <label class="block font-bold text-slate-600">ค่าน้ำมันรวม Easy Pass (บาท)</label>
          <input type="number" id="modalPlanFuelAmount" readonly class="w-full bg-white border border-emerald-300 rounded-xl p-2 font-black text-emerald-600">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-800 mb-1"><i class="fa-solid fa-paperclip text-rose-600 mr-1"></i> แนบภาพหลักฐานราคาน้ำมัน/สภาพงาน</label>
        <input type="file" id="modalAttachmentFiles" multiple accept="image/*" class="w-full text-xs border border-slate-300 rounded-xl p-1.5 bg-white">
      </div>

      <div class="flex justify-between items-center pt-4 border-t border-slate-100 flex-wrap gap-2">
        <button onclick="exportProposalPDF()" class="px-5 py-2.5 text-xs bg-purple-600 hover:bg-purple-700 text-white font-extrabold rounded-xl shadow-md transition flex items-center gap-1.5">
          <i class="fa-solid fa-file-pdf text-base"></i> พิมพ์บันทึกเสนออนุมัติ (PDF 3+ หน้า)
        </button>
        <div class="flex space-x-2">
          <button onclick="closePlanModal()" class="px-4 py-2 text-slate-500 text-xs">ยกเลิก</button>
          <button onclick="saveJobPlan()" class="px-5 py-2 bg-indigo-600 text-white font-bold rounded-xl text-xs">อนุมัติ & บันทึกแผนงาน</button>
        </div>
      </div>
    </div>
  </div>

  <!-- CLIENT SCRIPT -->
  <script>
    let GLOBAL_DATA = { villages: [], machines: [], operators: [], pendingRequests: [], approvedJobs: [] };
    let CURRENT_USER = { role: 'GUEST', name: 'Guest' };

    function callServer(functionName, payload) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler((response) => resolve(response))
          .withFailureHandler((error) => {
            showToast('เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์: ' + error.message, 'error');
            reject(error);
          })[functionName](payload);
      });
    }

    function calculateDaysBetween(startDateStr, endDateStr) {
      if (!startDateStr || !endDateStr) return 0;
      const d1 = new Date(startDateStr + 'T00:00:00');
      const d2 = new Date(endDateStr + 'T00:00:00');
      if (isNaN(d1) || isNaN(d2) || d2 < d1) return 0;
      return Math.floor(Math.abs(d2 - d1) / (1000 * 60 * 60 * 24)) + 1;
    }

    function formatThaiDate(dateStr) {
      if (!dateStr) return '-';
      const parts = String(dateStr).split('-');
      if (parts.length !== 3) return dateStr;
      let year = parseInt(parts[0], 10);
      if (year < 2400) year += 543;
      const thaiMonths = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
      return `${parseInt(parts[2], 10)} ${thaiMonths[parseInt(parts[1], 10) - 1]} ${year}`;
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      let bg = type === 'error' ? 'bg-rose-600 text-white' : (type === 'info' ? 'bg-indigo-600 text-white' : 'bg-slate-900 text-white');
      toast.className = `${bg} text-xs font-bold px-4 py-3 rounded-2xl shadow-xl flex items-center space-x-2 pointer-events-auto`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }

    window.onload = function() {
      restoreUserSession();
      loadData();
    };

    function restoreUserSession() {
      const savedRole = localStorage.getItem('MACHINE_APP_ROLE');
      const savedName = localStorage.getItem('MACHINE_APP_NAME');
      if (savedRole && savedName) {
        CURRENT_USER = { role: savedRole, name: savedName };
        document.getElementById('userBadge').innerText = `${CURRENT_USER.name}`;
        document.getElementById('authBtn').innerHTML = `<i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ`;
        document.getElementById('authBtn').onclick = logout;
      }
    }

    async function loadData() {
      showToast('กำลังโหลดข้อมูลฐานข้อมูล...', 'info');
      try {
        const data = await callServer('getInitialData');
        if (!data) return;
        GLOBAL_DATA = data;
        renderVillagesDropdown();
        renderPendingTable();
        renderJobsTable();
        updateRoleUI();
        showToast('โหลดข้อมูลสำเร็จ');
      } catch (err) {
        console.error('Error loading data:', err);
      }
    }

    function updateRoleUI() {
      const btnReq = document.getElementById('btnCreateRequest');
      if (CURRENT_USER.role === 'GUEST') {
        btnReq.classList.add('hidden');
      } else {
        btnReq.classList.remove('hidden');
      }
      const pCount = GLOBAL_DATA.pendingRequests ? GLOBAL_DATA.pendingRequests.length : 0;
      document.getElementById('widgetCount').innerText = pCount;
      document.getElementById('pendingBadgeTab').innerText = pCount;
      if (pCount > 0 && CURRENT_USER.role === 'SUPER_ADMIN') {
        document.getElementById('notificationWidget').classList.remove('hidden');
      } else {
        document.getElementById('notificationWidget').classList.add('hidden');
      }
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.replace('bg-slate-900', 'text-slate-600'));
      document.getElementById(tabId).classList.remove('hidden');
      document.getElementById('btn-' + tabId).classList.replace('text-slate-600', 'bg-slate-900');
    }

    function openRequestModal() { document.getElementById('requestModal').classList.remove('hidden'); }
    function closeRequestModal() { document.getElementById('requestModal').classList.add('hidden'); }
    function openLoginModal() { document.getElementById('loginModal').classList.remove('hidden'); }
    function closeLoginModal() { document.getElementById('loginModal').classList.add('hidden'); }

    async function performLogin() {
      const role = document.getElementById('loginRole').value;
      const pass = document.getElementById('loginPass').value;
      showToast('กำลังตรวจสอบรหัสผ่าน...', 'info');
      const res = await callServer('checkLogin', { role: role, password: pass });
      if (res && res.success) {
        CURRENT_USER = res;
        localStorage.setItem('MACHINE_APP_ROLE', CURRENT_USER.role);
        localStorage.setItem('MACHINE_APP_NAME', CURRENT_USER.name);
        document.getElementById('userBadge').innerText = `${CURRENT_USER.name}`;
        document.getElementById('authBtn').innerHTML = `<i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ`;
        document.getElementById('authBtn').onclick = logout;
        closeLoginModal();
        updateRoleUI();
        renderPendingTable();
        renderJobsTable();
        showToast('เข้าสู่ระบบสำเร็จ');
      } else {
        showToast(res ? res.message : 'เข้าสู่ระบบไม่สำเร็จ', 'error');
      }
    }

    function logout() {
      localStorage.removeItem('MACHINE_APP_ROLE');
      localStorage.removeItem('MACHINE_APP_NAME');
      CURRENT_USER = { role: 'GUEST', name: 'Guest' };
      document.getElementById('userBadge').innerText = 'Guest';
      document.getElementById('authBtn').innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ`;
      document.getElementById('authBtn').onclick = openLoginModal;
      updateRoleUI();
      renderPendingTable();
      renderJobsTable();
      showToast('ออกจากระบบเรียบร้อยแล้ว');
    }

    function renderVillagesDropdown() {
      const sel = document.getElementById('villageNo');
      sel.innerHTML = '<option value="">-- เลือกหมู่ที่ --</option>';
      if (GLOBAL_DATA.villages) {
        GLOBAL_DATA.villages.forEach(v => sel.innerHTML += `<option value="${v.no}">${v.display}</option>`);
      }
    }

    function autoFillVillageName() {
      const vNo = document.getElementById('villageNo').value;
      const found = GLOBAL_DATA.villages.find(v => String(v.no) === String(vNo));
      document.getElementById('villageName').value = found ? found.name : '';
    }

    async function handleRequestSubmit(e) {
      e.preventDefault();
      const payload = {
        subject: document.getElementById('reqSubject').value,
        requesterName: document.getElementById('requesterName').value,
        requesterPosition: document.getElementById('requesterPosition').value,
        villageNo: document.getElementById('villageNo').value,
        villageName: document.getElementById('villageName').value,
        reqStartDate: document.getElementById('reqStartDate').value,
        reqEndDate: document.getElementById('reqEndDate').value,
        docLink: document.getElementById('docLink').value
      };
      const res = await callServer('submitNewRequest', payload);
      if (res && res.success) {
        showToast('บันทึกคำขอรับบริการสำเร็จ! รหัส: ' + res.requestId);
        document.getElementById('requestForm').reset();
        closeRequestModal();
        loadData();
      }
    }

    function renderPendingTable() {
      const container = document.getElementById('pendingRequestsContainer');
      container.innerHTML = '';
      if (!GLOBAL_DATA.pendingRequests || GLOBAL_DATA.pendingRequests.length === 0) {
        container.innerHTML = `<div class="bg-white p-6 rounded-2xl text-center text-slate-400 text-xs">ไม่มีคำขอค้างรอการอนุมัติ</div>`;
        return;
      }
      GLOBAL_DATA.pendingRequests.forEach(req => {
        container.innerHTML += `
          <div class="bg-white border-l-4 border-amber-500 p-4 rounded-2xl shadow-sm space-y-2 text-xs">
            <div class="flex justify-between items-center font-bold text-slate-900">
              <span>${req.requestId} - หมู่ ${req.villageNo} ${req.villageName}</span>
              <span class="bg-amber-100 text-amber-900 px-2.5 py-0.5 rounded-full">รออนุมัติ</span>
            </div>
            <div><b>ผู้ยื่น:</b> ${req.requesterName} (${req.requesterPosition})</div>
            ${CURRENT_USER.role === 'SUPER_ADMIN' ? `
              <div class="text-right">
                <button onclick="openPlanModal(${req.rowIndex})" class="bg-emerald-600 text-white font-bold px-3 py-1 rounded-lg">อนุมัติ & จัดแผน</button>
              </div>
            ` : ''}
          </div>
        `;
      });
    }

    function renderJobsTable() {
      const container = document.getElementById('jobsTableContainer');
      container.innerHTML = '';
      if (!GLOBAL_DATA.approvedJobs || GLOBAL_DATA.approvedJobs.length === 0) {
        container.innerHTML = `<div class="bg-white p-6 rounded-2xl text-center text-slate-400 text-xs">ยังไม่มีแผนงานที่ได้รับการอนุมัติ</div>`;
        return;
      }
      GLOBAL_DATA.approvedJobs.forEach(job => {
        container.innerHTML += `
          <div class="bg-white p-4 rounded-2xl shadow-sm space-y-2 text-xs border border-slate-200">
            <div class="flex justify-between items-center font-bold text-slate-900">
              <span>${job.requestId} - หมู่ ${job.villageNo} ${job.villageName}</span>
              <span class="text-indigo-600">${formatThaiDate(job.planStartDate)} ถึง ${formatThaiDate(job.planEndDate)}</span>
            </div>
            <div><b>รถที่จัดสรร:</b> ${job.assignedMachine || '-'} | <b>ช่าง:</b> ${job.assignedOperator || '-'}</div>
            ${CURRENT_USER.role === 'SUPER_ADMIN' ? `
              <div class="text-right">
                <button onclick="openPlanModal(${job.rowIndex})" class="bg-slate-800 text-white font-bold px-3 py-1 rounded-lg">แก้ไขแผนงาน</button>
              </div>
            ` : ''}
          </div>
        `;
      });
    }

    function openPlanModal(rowIndex) {
      let job = GLOBAL_DATA.pendingRequests.find(j => j.rowIndex === rowIndex);
      if (!job) job = GLOBAL_DATA.approvedJobs.find(j => j.rowIndex === rowIndex);
      if (!job) return;

      document.getElementById('modalRowIndex').value = rowIndex;
      document.getElementById('modalPlanStartDate').value = job.planStartDate || job.reqStartDate || '';
      document.getElementById('modalPlanEndDate').value = job.planEndDate || job.reqEndDate || '';
      document.getElementById('modalPlanOilPrice').value = job.planOilPrice || 35.00;

      renderMachineCheckboxes(job.assignedMachine);
      renderOperatorCheckboxes(job.assignedOperator);
      recalculateFuel();
      document.getElementById('planModal').classList.remove('hidden');
    }

    function renderMachineCheckboxes(selectedStr) {
      const mContainer = document.getElementById('modalMachineCheckboxes');
      mContainer.innerHTML = '';
      const selected = selectedStr ? selectedStr.split(', ') : [];
      if (GLOBAL_DATA.machines) {
        GLOBAL_DATA.machines.forEach(m => {
          const chk = selected.includes(m.name) ? 'checked' : '';
          mContainer.innerHTML += `
            <label class="flex items-center space-x-2 text-xs">
              <input type="checkbox" name="modal_chkMachine" value="${m.name}" data-rate="${m.fuelRate || 0}" ${chk} onchange="recalculateFuel()" class="rounded text-amber-600">
              <span>${m.name}</span>
            </label>
          `;
        });
      }
    }

    function renderOperatorCheckboxes(selectedStr) {
      const oContainer = document.getElementById('modalOperatorCheckboxes');
      oContainer.innerHTML = '';
      const selected = selectedStr ? selectedStr.split(', ') : [];
      if (GLOBAL_DATA.operators) {
        GLOBAL_DATA.operators.forEach(o => {
          const chk = selected.includes(o.name) ? 'checked' : '';
          oContainer.innerHTML += `
            <label class="flex items-center space-x-2 text-xs">
              <input type="checkbox" name="modal_chkOperator" value="${o.name}" ${chk} class="rounded text-blue-600">
              <span>${o.name}</span>
            </label>
          `;
        });
      }
    }

    function recalculateFuel() {
      const s = document.getElementById('modalPlanStartDate').value;
      const e = document.getElementById('modalPlanEndDate').value;
      const oilPrice = parseFloat(document.getElementById('modalPlanOilPrice').value) || 35.00;
      const diffDays = calculateDaysBetween(s, e);
      document.getElementById('modalPlanDays').value = diffDays;

      let totalFuel = 0;
      document.querySelectorAll('input[name="modal_chkMachine"]:checked').forEach(c => {
        totalFuel += diffDays * (parseFloat(c.getAttribute('data-rate')) || 0);
      });

      document.getElementById('modalPlanFuel').value = totalFuel.toFixed(2);
      document.getElementById('modalPlanFuelAmount').value = (totalFuel * oilPrice).toFixed(2);
    }

    function closePlanModal() { document.getElementById('planModal').classList.add('hidden'); }

    async function saveJobPlan() {
      const selMachines = [];
      document.querySelectorAll('input[name="modal_chkMachine"]:checked').forEach(c => selMachines.push(c.value));
      const selOperators = [];
      document.querySelectorAll('input[name="modal_chkOperator"]:checked').forEach(c => selOperators.push(c.value));

      const payload = {
        rowIndex: parseInt(document.getElementById('modalRowIndex').value),
        approvalStatus: 'Accepted',
        approvalRemark: 'อนุมัติจัดแผนงาน',
        planStartDate: document.getElementById('modalPlanStartDate').value,
        planEndDate: document.getElementById('modalPlanEndDate').value,
        planDays: parseInt(document.getElementById('modalPlanDays').value) || 0,
        assignedMachine: selMachines.join(', '),
        assignedOperator: selOperators.join(', '),
        planFuelLiters: parseFloat(document.getElementById('modalPlanFuel').value) || 0,
        planOilPrice: parseFloat(document.getElementById('modalPlanOilPrice').value) || 0,
        approvedBy: 'นายศราวุธ ฟ้าแลบ'
      };

      const res = await callServer('updateJobApprovalAndPlan', payload);
      if (res && res.success) {
        showToast('อนุมัติและบันทึกแผนงานสำเร็จ');
        closePlanModal();
        loadData();
      }
    }

    function compressImageFile(file, maxWidth = 1000, quality = 0.7) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = () => resolve('');
          img.src = e.target.result;
        };
        reader.onerror = () => resolve('');
        reader.readAsDataURL(file);
      });
    }

    async function exportProposalPDF() {
      const rowIndex = parseInt(document.getElementById('modalRowIndex').value);
      let job = GLOBAL_DATA.pendingRequests.find(j => j.rowIndex === rowIndex);
      if (!job) job = GLOBAL_DATA.approvedJobs.find(j => j.rowIndex === rowIndex);
      if (!job) return;

      const selMachines = [];
      document.querySelectorAll('input[name="modal_chkMachine"]:checked').forEach(c => selMachines.push(c.value));
      const selOperators = [];
      document.querySelectorAll('input[name="modal_chkOperator"]:checked').forEach(c => selOperators.push(c.value));

      const jobData = {
        requestId: job.requestId,
        docNo: job.docNo || job.requestId,
        docDate: job.docDate || job.requestDate,
        subject: 'ขอสนับสนุนเครื่องจักรกลเพื่อเข้าปฏิบัติงานในพื้นที่',
        requesterName: job.requesterName,
        requesterPosition: job.requesterPosition,
        villageNo: job.villageNo,
        villageName: job.villageName,
        reqStartDate: job.reqStartDate,
        reqEndDate: job.reqEndDate,
        planStartDate: document.getElementById('modalPlanStartDate').value,
        planEndDate: document.getElementById('modalPlanEndDate').value,
        planDays: parseInt(document.getElementById('modalPlanDays').value) || 0,
        assignedMachine: selMachines.join(', '),
        assignedOperator: selOperators.join(', '),
        planFuelLiters: parseFloat(document.getElementById('modalPlanFuel').value) || 0,
        planOilPrice: parseFloat(document.getElementById('modalPlanOilPrice').value) || 0,
        planFuelAmount: parseFloat(document.getElementById('modalPlanFuelAmount').value) || 0,
        approvedBy: 'นายศราวุธ ฟ้าแลบ'
      };

      const fileInput = document.getElementById('modalAttachmentFiles');
      showToast('กำลังบีบอัดรูปภาพและสร้าง PDF เสนออนุมัติ...', 'info');

      const attachmentImages = [];
      if (fileInput.files && fileInput.files.length > 0) {
        for (let i = 0; i < fileInput.files.length; i++) {
          const base64 = await compressImageFile(fileInput.files[i]);
          if (base64) attachmentImages.push(base64);
        }
      }

      try {
        const res = await callServer('generateProposalPDF', { job: jobData, attachmentImages: attachmentImages });
        if (res && res.pdfDataUrl) {
          const downloadLink = document.createElement("a");
          downloadLink.href = res.pdfDataUrl;
          downloadLink.download = `Proposal-${jobData.requestId}.pdf`;
          document.body.appendChild(downloadLink);
          downloadLink.click();
          document.body.removeChild(downloadLink);
          showToast('ดาวน์โหลดเอกสารเสนออนุมัติ PDF เรียบร้อยแล้ว');
        } else {
          showToast(res ? res.message : 'เกิดข้อผิดพลาดในการสร้าง PDF', 'error');
        }
      } catch (err) {
        showToast('เกิดข้อผิดพลาดในการสร้าง PDF: ' + err.message, 'error');
      }
    }
  </script>
